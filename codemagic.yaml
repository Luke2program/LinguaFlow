workflows:
  ios-build-and-test:
    name: QuestFlow iOS Build & Test
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      ios_simulator: iPhone 17 Pro
      cocoapods: default
      vars:
        BUNDLE_ID: "com.lukaskoprolin.LinguaFlow"
    cache:
      cache_paths:
        - ~/Library/Developer/Xcode/DerivedData
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Build and test with retained verification evidence
        script: |
          bash ci_scripts/verify_ios.sh
    artifacts:
      - build/verification/**/TestResults.xcresult
      - build/verification/**/xcodebuild.log
      - build/verification/**/revision.txt
      - build/verification/**/DerivedData/Build/Products/Debug-iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - lukas.koprolin@gmail.com
